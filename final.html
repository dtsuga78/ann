<script>
let msg = "DECRYPTING FINAL FILE...";
let i = 0;

function type() {
  if (i < msg.length) {
    document.getElementById("line").innerHTML += msg[i];
    i++;
    setTimeout(type, 55);
  } else {
    setTimeout(() => {
      document.getElementById("message").style.opacity = "1";
      revealLines();
    }, 900);
  }
}

function revealLines() {
  const lines = document.querySelectorAll(".fade");
  let j = 0;

  function showNext() {
    if (j < lines.length) {
      lines[j].style.opacity = "1";
      j++;
      setTimeout(showNext, 900);
    }
  }

  showNext();
}

type();
</script>
